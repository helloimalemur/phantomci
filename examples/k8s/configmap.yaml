apiVersion: v1
kind: ConfigMap
metadata:
  name: phantomci-config
  namespace: phantomci
data:
  Repo.toml: |
    [your-repo]
    path = "git@github.com:your-org/your-repo.git"
    target_branch = "main"
    # Optional: explicit key path (the image uses this for Git SSH access)
    ssh_key_path = "/root/.ssh/id_ed25519"

