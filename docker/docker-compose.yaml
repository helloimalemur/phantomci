services:
  docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 5s
      retries: 30

  phantom_ci:
    image: phantomci:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
      WAIT_FOR_DOCKER: "true"
    volumes:
      - phantomci-config:/root/.config/phantom_ci
      - phantomci-cache:/root/.cache/phantom_ci

volumes:
  docker-data:
  phantomci-config:
  phantomci-cache: